[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.scripts]
edit = "edit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
