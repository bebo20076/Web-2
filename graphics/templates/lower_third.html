<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    .lt-wrap {
      position: fixed;
      bottom: 100px;
      left: 80px;
      opacity: 0;
      pointer-events: none;
    }

    .lt-bar {
      width: 0;
      height: 5px;
      background: linear-gradient(90deg, #ff4e00, #ffd200);
      border-radius: 3px;
      margin-bottom: 14px;
    }

    .lt-name {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .lt-title {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 30px;
      font-weight: 400;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<div id="stage"
  data-composition-id="lower-third"
  data-width="{{WIDTH}}"
  data-height="{{HEIGHT}}"
  data-start="0"
  data-duration="{{DURATION}}">

  <video
    class="clip"
    data-start="0"
    data-duration="{{DURATION}}"
    data-track-index="0"
    src="{{VIDEO_SRC}}"
    playsinline>
  </video>

  <div class="lt-wrap" id="lt" data-track-index="1">
    <div class="lt-bar" id="ltBar"></div>
    <div class="lt-name">{{NAME}}</div>
    <div class="lt-title">{{TITLE}}</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
// Lower third appears at {{START}}s and holds for {{SHOW_DURATION}}s
const startAt = parseFloat("{{START}}" || "1");
const hold = parseFloat("{{SHOW_DURATION}}" || "4");
const outAt = startAt + hold;

const tl = gsap.timeline({ paused: true });
tl.to("#ltBar", { width: 180, duration: 0.35, ease: "power3.out" }, startAt)
  .to("#lt", { opacity: 1, duration: 0.4, ease: "power2.out" }, startAt)
  .from(".lt-name", { x: -40, opacity: 0, duration: 0.45, ease: "power3.out" }, startAt + 0.1)
  .from(".lt-title", { x: -28, opacity: 0, duration: 0.4, ease: "power2.out" }, startAt + 0.25)
  .to("#lt", { opacity: 0, y: 8, duration: 0.35, ease: "power2.in" }, outAt - 0.35);

window.__timelines = window.__timelines || {};
window.__timelines["lower-third"] = tl;
</script>
</body>
</html>
