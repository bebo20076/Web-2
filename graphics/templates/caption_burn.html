<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #cap {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 78%;
      text-align: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 68px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1.5px;
      line-height: 1.1;
      text-shadow:
        0 0 40px rgba(0,0,0,0.9),
        2px 2px 0 rgba(0,0,0,0.7),
        -2px -2px 0 rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="stage"
  data-composition-id="caption-burn"
  data-width="{{WIDTH}}"
  data-height="{{HEIGHT}}"
  data-start="0"
  data-duration="{{DURATION}}">

  <video
    class="clip"
    data-start="0"
    data-duration="{{DURATION}}"
    data-track-index="0"
    src="{{VIDEO_SRC}}"
    playsinline>
  </video>

  <div id="cap" data-track-index="1"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const captions = {{CAPTIONS_JSON}};
const capEl = document.getElementById("cap");
const tl = gsap.timeline({ paused: true });

captions.forEach(cap => {
  const showDuration = Math.max(0.06, cap.end - cap.start);
  tl.call(() => { capEl.textContent = cap.text; }, [], cap.start)
    .to(capEl, { opacity: 1, duration: 0.06, ease: "none" }, cap.start)
    .to(capEl, { opacity: 0, duration: 0.06, ease: "none" }, cap.end - 0.06);
});

window.__timelines = window.__timelines || {};
window.__timelines["caption-burn"] = tl;
</script>
</body>
</html>
