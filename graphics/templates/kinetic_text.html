<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    .kt-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .kt-word {
      position: absolute;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 900;
      color: #fff;
      text-align: center;
      opacity: 0;
      transform: scale(0.6);
    }
  </style>
</head>
<body>
<div id="stage"
  data-composition-id="kinetic-text"
  data-width="{{WIDTH}}"
  data-height="{{HEIGHT}}"
  data-start="0"
  data-duration="{{DURATION}}">

  <video
    class="clip"
    data-start="0"
    data-duration="{{DURATION}}"
    data-track-index="0"
    src="{{VIDEO_SRC}}"
    playsinline>
  </video>

  <div class="kt-container" id="ktContainer" data-track-index="1"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const captions = {{CAPTIONS_JSON}};
const container = document.getElementById("ktContainer");

// Pre-build word elements
const elements = captions.map((cap, i) => {
  const el = document.createElement("div");
  el.className = "kt-word";
  el.textContent = cap.text;

  // Vary size + position for kinetic feel
  const sizes = [72, 88, 64, 96, 80];
  el.style.fontSize = sizes[i % sizes.length] + "px";

  // Randomize position within safe zone
  const posX = (Math.sin(i * 1.618) * 28).toFixed(1);
  const posY = (Math.cos(i * 2.094) * 22).toFixed(1);
  el.style.left = `calc(50% + ${posX}%)`;
  el.style.top = `calc(50% + ${posY}%)`;
  el.style.transform = "translate(-50%, -50%) scale(0.6)";

  // Alternate colors
  const colors = ["#fff", "#ffd200", "#ff4e00", "#00e5ff"];
  el.style.color = colors[i % colors.length];

  container.appendChild(el);
  return el;
});

const tl = gsap.timeline({ paused: true });

captions.forEach((cap, i) => {
  const el = elements[i];
  const dur = Math.max(0.1, cap.end - cap.start);
  const outTime = cap.start + dur - 0.1;

  tl.to(el, {
    opacity: 1, scale: 1,
    duration: 0.12, ease: "back.out(2)",
    transformOrigin: "center center",
  }, cap.start)
  .to(el, {
    opacity: 0, scale: 1.15,
    duration: 0.1, ease: "power2.in",
    transformOrigin: "center center",
  }, outTime);
});

window.__timelines = window.__timelines || {};
window.__timelines["kinetic-text"] = tl;
</script>
</body>
</html>
