<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    .card {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
    }

    .card-eyebrow {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .card-title {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 96px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -3px;
      line-height: 1;
      text-align: center;
      max-width: 80%;
    }

    .card-subtitle {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 32px;
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.5px;
      text-align: center;
    }

    .card-rule {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #ff4e00, #ffd200);
      border-radius: 2px;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
    }
  </style>
</head>
<body>
<div id="stage"
  data-composition-id="title-card"
  data-width="{{WIDTH}}"
  data-height="{{HEIGHT}}"
  data-start="0"
  data-duration="{{DURATION}}">

  <video
    class="clip"
    data-start="0"
    data-duration="{{DURATION}}"
    data-track-index="0"
    src="{{VIDEO_SRC}}"
    playsinline>
  </video>

  <div class="bg-overlay" id="bgOverlay" data-track-index="1" style="opacity:0"></div>

  <div class="card" id="card" data-track-index="2">
    <div class="card-eyebrow" id="eyebrow">{{EYEBROW}}</div>
    <div class="card-rule" id="rule"></div>
    <div class="card-title" id="cardTitle">{{TITLE}}</div>
    <div class="card-subtitle" id="subtitle">{{SUBTITLE}}</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
const startAt = parseFloat("{{START}}" || "0");
const hold = parseFloat("{{SHOW_DURATION}}" || "4");
const outAt = startAt + hold;

const tl = gsap.timeline({ paused: true });
tl.to("#bgOverlay", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, startAt)
  .to("#card", { opacity: 1, duration: 0.1, ease: "none" }, startAt + 0.1)
  .from("#eyebrow", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, startAt + 0.2)
  .from("#rule", { scaleX: 0, duration: 0.4, ease: "power3.out", transformOrigin: "left" }, startAt + 0.4)
  .from("#cardTitle", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, startAt + 0.45)
  .from("#subtitle", { y: 20, opacity: 0, duration: 0.5, ease: "power2.out" }, startAt + 0.65)
  .to("#card", { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" }, outAt - 0.5)
  .to("#bgOverlay", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, outAt - 0.5);

window.__timelines = window.__timelines || {};
window.__timelines["title-card"] = tl;
</script>
</body>
</html>
